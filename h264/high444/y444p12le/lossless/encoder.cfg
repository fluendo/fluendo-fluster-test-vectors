DFAlphaNRefBSlice      = 0

DFBetaRefISlice        = 0
DFBetaNRefISlice       = 0
DFBetaRefPSlice        = 0
DFBetaNRefPSlice        = 0
DFBetaRefBSlice        = 0
DFBetaNRefBSlice       = 0

# Scaling matrices disabled
