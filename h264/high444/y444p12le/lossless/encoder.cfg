WeightedBiprediction   = 0
ChromaWeightSupport    = 1
UseWeightedReferenceME = 1
WPMethod               = 1
WPIterMC               = 0

# Deblocking
DFParametersFlag       = 1
DFDisableRefISlice     = 0
DFDisableNRefISlice    = 0
DFDisableRefPSlice     = 0
DFDisableNRefPSlice    = 0
DFDisableRefBSlice     = 0
DFDisableNRefBSlice    = 0

DFAlphaRefISlice       = 0
DFAlphaNRefISlice      = 0
