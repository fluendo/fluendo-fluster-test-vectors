# ============================================================================
# JM lossless H.264 High 4:4:4 Predictive configuration
# 12-bit 4:4:4, CABAC, progressive, lossless
# ============================================================================

# Files
InputFile             = input_12bit_1080p.yuv
InputHeaderLength     = 0
StartFrame            = 0
FramesToBeEncoded     = 5
FrameRate             = 24.0

OutputFile            = y444p12le_1920x1080_lossless.h264
 ReconFile             = recon_12bit_444_lossless.yuv
# TraceFile             = trace_lossless.txt
# StatsFile             = stats_lossless.dat

# Dimensions
SourceWidth           = 1920
SourceHeight          = 1080
SourceResize          = 0
OutputWidth           = 1920
OutputHeight          = 1080

# Profile and format
ProfileIDC            = 244
IntraProfile          = 0
LevelIDC              = 51

YUVFormat             = 3
RGBInput              = 0
PixelFormat           = 0
Interleaved           = 0
Grayscale             = 0
SeparateColourPlane   = 0

# Bit depth
SourceBitDepthLuma    = 12
SourceBitDepthChroma  = 12
SourceBitDepthRescale = 0
OutputBitDepthLuma    = 12
OutputBitDepthChroma  = 12

# Progressive coding
PicInterlace          = 0
MbInterlace           = 0
IntraBottom           = 0

# GOP
IntraPeriod           = 15
IDRPeriod             = 15
AdaptiveIntraPeriod   = 1
AdaptiveIDRPeriod     = 0
EnableOpenGOP         = 0
EnableIDRGOP          = 1

# B pictures, but no hierarchical QP offsets
NumberBFrames         = 3
BReferencePictures    = 0
HierarchicalCoding    = 0

NumberReferenceFrames = 5
PList0References      = 0
BList0References      = 0
BList1References      = 1

ReferenceReorder      = 1
PocMemoryManagement   = 1
LowDelay              = 0

# Direct prediction
DirectModeType        = 1
DirectInferenceFlag   = 1

# CABAC
SymbolMode            = 1
ContextInitMethod     = 1
FixedModelNumber      = 0
OutFileMode           = 0
PartitionMode         = 0

# Motion estimation
SearchMode            = 3
SearchRange           = 32
DisableSubpelME       = 0
EPZSSubPelME          = 1
EPZSSubPelMEBiPred    = 1
EPZSSubPelGrid        = 1
EPZSUseHMEPredictors  = 1
HMEEnable             = 1

# Prediction modes
PSliceSkip            = 1
PSliceSearch16x16     = 1
PSliceSearch16x8      = 1
PSliceSearch8x16      = 1
PSliceSearch8x8       = 1
PSliceSearch8x4       = 1
PSliceSearch4x8        = 1
PSliceSearch4x4        = 1

BSliceDirect           = 1
BSliceSearch16x16      = 1
BSliceSearch16x8       = 1
BSliceSearch8x16       = 1
BSliceSearch8x8        = 1
BSliceSearch8x4        = 1
BSliceSearch4x8        = 1
BSliceSearch4x4        = 1

BiPredMotionEstimation = 1
BiPredSearch16x16      = 1
BiPredSearch16x8       = 0
BiPredSearch8x16       = 0
BiPredSearch8x8        = 0
BiPredMERefinements    = 3
BiPredMESearchRange    = 16
BiPredMESubPel         = 2

# 4:4:4 support
ChromaMCBuffer         = 1
ChromaMEEnable         = 2
ChromaMEWeight         = 1

# Lossless coding
RateControlEnable      = 0
QPISlice               = -24
QPPSlice               = -24
QPBSlice               = -24
LosslessCoding         = 1

# Transform and coding decisions
Transform8x8Mode       = 1
RDOptimization         = 1
DistortionEstimation   = 1
SubMBCodingState       = 2
I16RDOpt               = 1
EnableIPCM             = 1

# Weighted prediction is unavailable for 4:4:4 in this JM build
