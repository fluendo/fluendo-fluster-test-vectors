ScalingListPresentFlag6  = 0
ScalingListPresentFlag7  = 0
ScalingListPresentFlag8  = 0
ScalingListPresentFlag9  = 0
ScalingListPresentFlag10 = 0
ScalingListPresentFlag11 = 0

