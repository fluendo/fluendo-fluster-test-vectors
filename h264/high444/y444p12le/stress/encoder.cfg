# ============================================================================
# JM High 4:4:4 Predictive stress test
# 12-bit 4:4:4, CABAC, progressive, B frames, hierarchical references
# Weighted prediction is disabled because this JM build rejects it for 4:4:4.
# ============================================================================

# ---------------------------------------------------------------------------
# Input/output files
# ---------------------------------------------------------------------------

InputFile          = input_12bit_444.yuv
InputHeaderLength  = 0
StartFrame         = 0
FramesToBeEncoded  = 100
FrameRate          = 24.0

OutputFile         = output_12bit_hi444.h264
ReconFile          = recon_12bit_444.yuv
TraceFile          = trace_enc.txt
StatsFile          = stats_high444.dat

# ---------------------------------------------------------------------------
# Frame dimensions
# ---------------------------------------------------------------------------

SourceWidth        = 1920
SourceHeight       = 1080
SourceResize       = 0
OutputWidth        = 1920
OutputHeight       = 1080

# ---------------------------------------------------------------------------
# Profile, level, and pixel format
# ---------------------------------------------------------------------------

ProfileIDC         = 244
IntraProfile       = 0
LevelIDC           = 51

YUVFormat          = 3
RGBInput           = 0
PixelFormat        = 0
Interleaved        = 0
Grayscale          = 0
SeparateColourPlane = 0

SourceBitDepthLuma    = 12
SourceBitDepthChroma  = 12
SourceBitDepthRescale = 0
OutputBitDepthLuma    = 12
OutputBitDepthChroma  = 12

# ---------------------------------------------------------------------------
# Progressive frame coding
# ---------------------------------------------------------------------------

PicInterlace       = 0
MbInterlace        = 0
IntraBottom        = 0

# ---------------------------------------------------------------------------
# GOP structure
# ---------------------------------------------------------------------------

IntraPeriod          = 48
IDRPeriod            = 48
IntraDelay           = 0
AdaptiveIntraPeriod  = 1
AdaptiveIDRPeriod    = 0
EnableOpenGOP        = 0
EnableIDRGOP         = 1

NumberBFrames        = 3
PReplaceBSlice       = 0

# Explicit hierarchy for exactly three B frames.
# Every display-order value must be 0, 1, or 2.
HierarchicalCoding      = 3
HierarchyLevelQPEnable  = 1
ExplicitHierarchyFormat = b2r0b1r1b0e2

# ---------------------------------------------------------------------------
# Reference-picture management
# ---------------------------------------------------------------------------

NumberReferenceFrames = 6

PList0References      = 0
BList0References      = 0
BList1References      = 2

BReferencePictures    = 1
ReferenceReorder      = 1
EnableReorderBslice   = 0
UseDistortionReorder  = 0
PocMemoryManagement   = 1

LowDelay             = 0
RestrictRefFrames    = 0
DisposableP           = 0
SetFirstAsLongTerm   = 0

# ---------------------------------------------------------------------------
# Picture order
# ---------------------------------------------------------------------------

PicOrderCntType       = 0
Log2MaxFNumMinus4     = 0
Log2MaxPOCLsbMinus4   = 2

# ---------------------------------------------------------------------------
# Entropy coding
# ---------------------------------------------------------------------------

SymbolMode            = 1
ContextInitMethod     = 1
FixedModelNumber      = 0

OutFileMode           = 0
PartitionMode         = 0

# ---------------------------------------------------------------------------
# Direct mode and bidirectional prediction
# ---------------------------------------------------------------------------

DirectModeType        = 1
DirectInferenceFlag   = 1

BSliceDirect          = 1

BiPredMotionEstimation = 1
BiPredSearch16x16      = 1
BiPredSearch16x8       = 1
BiPredSearch8x16       = 1
BiPredSearch8x8        = 1

BiPredMERefinements    = 3
BiPredMESearchRange    = 16
BiPredMESubPel         = 2

# ---------------------------------------------------------------------------
# P-slice motion search
# ---------------------------------------------------------------------------

PSliceSkip             = 1
PSliceSearch16x16      = 1
PSliceSearch16x8       = 1
PSliceSearch8x16       = 1
PSliceSearch8x8        = 1
PSliceSearch8x4        = 1
PSliceSearch4x8        = 1
PSliceSearch4x4        = 1

# ---------------------------------------------------------------------------
# B-slice motion search
# ---------------------------------------------------------------------------

BSliceSearch16x16      = 1
BSliceSearch16x8       = 1
BSliceSearch8x16       = 1
BSliceSearch8x8        = 1
BSliceSearch8x4        = 1
BSliceSearch4x8        = 1
BSliceSearch4x4        = 1

# ---------------------------------------------------------------------------
# Motion-estimation configuration
# ---------------------------------------------------------------------------

SearchMode             = 3
SearchRange            = 32

DisableSubpelME       = 0
EPZSSubPelME          = 1
EPZSSubPelMEBiPred    = 1
EPZSSubPelGrid        = 1
EPZSUseHMEPredictors  = 1

HMEEnable             = 1
HMEDisableMMCO        = 0

EPZSPattern           = 2
EPZSDualRefinement    = 3
EPZSFixedPredictors   = 3
EPZSAggressiveWindow  = 0
EPZSTemporal          = 1
EPZSSpatialMem        = 1
EPZSBlockType         = 1

EPZSMinThresScale     = 0
EPZSMaxThresScale     = 2
EPZSMedThresScale     = 1
EPZSSubPelThresScale  = 1

DisableMEPrediction   = 0
RestrictSearchRange   = 2
UseMVLimits           = 0

# ---------------------------------------------------------------------------
# 4:4:4 chroma motion compensation and motion estimation
# ---------------------------------------------------------------------------

ChromaMCBuffer        = 1
ChromaMEEnable        = 2
ChromaMEWeight        = 1

OnTheFlyFractMCP      = 0
MESoftenSSEMetric     = 0
MEDistortionFPel      = 0
MEDistortionHPel      = 0
MEDistortionQPel      = 2
MDDistortion          = 2

# ---------------------------------------------------------------------------
