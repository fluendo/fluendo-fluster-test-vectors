DistortionMS_SSIM     = 0
DistortionYUVtoRGB    = 0

DisableThresholding   = 0
DisableBSkipRDO       = 0
BiasSkipRDO           = 0
ForceTrueRateRDO      = 0

# ---------------------------------------------------------------------------
